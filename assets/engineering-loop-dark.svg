<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Hesham Mohamed engineering loop</title>
  <desc id="desc">A production AI workflow: input, perception, validation, service, and evaluation.</desc>
  <rect width="1200" height="260" rx="18" fill="#0D1219"/>
  <rect x="1" y="1" width="1198" height="258" rx="17" fill="none" stroke="#27313D"/>

  <text x="42" y="46" fill="#748293" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="2">ENGINEERING LOOP / VERIFIED STACK</text>
  <text x="42" y="74" fill="#DCE5EE" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="650">A model is only one stage of the system.</text>

  <path d="M111 153H1082" stroke="#2F3D4B" stroke-width="2"/>
  <path d="M111 153H1082" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="5 12" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-68" dur="4.5s" repeatCount="indefinite"/>
  </path>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <g transform="translate(48 112)">
      <rect width="150" height="82" rx="12" fill="#101821" stroke="#2D3B48"/>
      <circle cx="22" cy="20" r="5" fill="#2DD4BF"/>
      <text x="36" y="24" fill="#E5EDF5" font-size="11" font-weight="700">INPUT</text>
      <text x="18" y="49" fill="#8E9BAA" font-size="10">images · sensors</text>
      <text x="18" y="66" fill="#617181" font-size="9">validate first</text>
    </g>

    <g transform="translate(276 112)">
      <rect width="150" height="82" rx="12" fill="#101821" stroke="#2D3B48"/>
      <circle cx="22" cy="20" r="5" fill="#4B9CF5"/>
      <text x="36" y="24" fill="#E5EDF5" font-size="11" font-weight="700">PERCEPTION</text>
      <text x="18" y="49" fill="#8E9BAA" font-size="10">OpenCV · PyTorch</text>
      <text x="18" y="66" fill="#617181" font-size="9">extract signal</text>
    </g>

    <g transform="translate(504 112)">
      <rect width="150" height="82" rx="12" fill="#101821" stroke="#2D3B48"/>
      <circle cx="22" cy="20" r="5" fill="#F59E0B"/>
      <text x="36" y="24" fill="#E5EDF5" font-size="11" font-weight="700">VALIDATION</text>
      <text x="18" y="49" fill="#8E9BAA" font-size="10">bounds · tests · QC</text>
      <text x="18" y="66" fill="#617181" font-size="9">make failure explicit</text>
    </g>

    <g transform="translate(732 112)">
      <rect width="150" height="82" rx="12" fill="#101821" stroke="#2D3B48"/>
      <circle cx="22" cy="20" r="5" fill="#A78BFA"/>
      <text x="36" y="24" fill="#E5EDF5" font-size="11" font-weight="700">SERVICE</text>
      <text x="18" y="49" fill="#8E9BAA" font-size="10">FastAPI · Docker</text>
      <text x="18" y="66" fill="#617181" font-size="9">reproducible delivery</text>
    </g>

    <g transform="translate(960 112)">
      <rect width="150" height="82" rx="12" fill="#10201F" stroke="#2DD4BF" stroke-opacity="0.65"/>
      <circle cx="22" cy="20" r="5" fill="#2DD4BF">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="24" fill="#E5EDF5" font-size="11" font-weight="700">EVALUATION</text>
      <text x="18" y="49" fill="#8E9BAA" font-size="10">CI · metrics · limits</text>
      <text x="18" y="66" fill="#5EEAD4" font-size="9">evidence over claims</text>
    </g>
  </g>

  <g fill="#2DD4BF">
    <circle cx="111" cy="153" r="4"/>
    <circle cx="1082" cy="153" r="4"/>
  </g>
  <text x="1152" y="228" fill="#596979" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="1">BUILD → EVALUATE → SHIP</text>
</svg>