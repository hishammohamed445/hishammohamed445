<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Hesham Mohamed engineering loop</title>
  <desc id="desc">A production AI workflow: input, perception, validation, service, and evaluation.</desc>
  <rect width="1200" height="260" rx="18" fill="#FFFFFF"/>
  <rect x="1" y="1" width="1198" height="258" rx="17" fill="none" stroke="#CDD6DF"/>

  <text x="42" y="46" fill="#68798A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="2">ENGINEERING LOOP / VERIFIED STACK</text>
  <text x="42" y="74" fill="#1B2732" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="650">A model is only one stage of the system.</text>

  <path d="M111 153H1082" stroke="#D1DAE3" stroke-width="2"/>
  <path d="M111 153H1082" stroke="#0F9F8F" stroke-width="2" stroke-dasharray="5 12" opacity="0.72">
    <animate attributeName="stroke-dashoffset" values="0;-68" dur="4.5s" repeatCount="indefinite"/>
  </path>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <g transform="translate(48 112)">
      <rect width="150" height="82" rx="12" fill="#F8FAFC" stroke="#D3DCE5"/>
      <circle cx="22" cy="20" r="5" fill="#0F9F8F"/>
      <text x="36" y="24" fill="#263440" font-size="11" font-weight="700">INPUT</text>
      <text x="18" y="49" fill="#607181" font-size="10">images · sensors</text>
      <text x="18" y="66" fill="#8795A3" font-size="9">validate first</text>
    </g>

    <g transform="translate(276 112)">
      <rect width="150" height="82" rx="12" fill="#F8FAFC" stroke="#D3DCE5"/>
      <circle cx="22" cy="20" r="5" fill="#2186D9"/>
      <text x="36" y="24" fill="#263440" font-size="11" font-weight="700">PERCEPTION</text>
      <text x="18" y="49" fill="#607181" font-size="10">OpenCV · PyTorch</text>
      <text x="18" y="66" fill="#8795A3" font-size="9">extract signal</text>
    </g>

    <g transform="translate(504 112)">
      <rect width="150" height="82" rx="12" fill="#F8FAFC" stroke="#D3DCE5"/>
      <circle cx="22" cy="20" r="5" fill="#D99000"/>
      <text x="36" y="24" fill="#263440" font-size="11" font-weight="700">VALIDATION</text>
      <text x="18" y="49" fill="#607181" font-size="10">bounds · tests · QC</text>
      <text x="18" y="66" fill="#8795A3" font-size="9">make failure explicit</text>
    </g>

    <g transform="translate(732 112)">
      <rect width="150" height="82" rx="12" fill="#F8FAFC" stroke="#D3DCE5"/>
      <circle cx="22" cy="20" r="5" fill="#7C63C8"/>
      <text x="36" y="24" fill="#263440" font-size="11" font-weight="700">SERVICE</text>
      <text x="18" y="49" fill="#607181" font-size="10">FastAPI · Docker</text>
      <text x="18" y="66" fill="#8795A3" font-size="9">reproducible delivery</text>
    </g>

    <g transform="translate(960 112)">
      <rect width="150" height="82" rx="12" fill="#ECFDF9" stroke="#0F9F8F" stroke-opacity="0.65"/>
      <circle cx="22" cy="20" r="5" fill="#0F9F8F">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="24" fill="#263440" font-size="11" font-weight="700">EVALUATION</text>
      <text x="18" y="49" fill="#607181" font-size="10">CI · metrics · limits</text>
      <text x="18" y="66" fill="#0B7F73" font-size="9">evidence over claims</text>
    </g>
  </g>

  <g fill="#0F9F8F">
    <circle cx="111" cy="153" r="4"/>
    <circle cx="1082" cy="153" r="4"/>
  </g>
  <text x="1152" y="228" fill="#81909D" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="1">BUILD → EVALUATE → SHIP</text>
</svg>