<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Hesham Mohamed — AI Engineer</title>
  <desc id="desc">Editorial personal profile banner with restrained motion and a red accent.</desc>

  <rect width="1200" height="390" fill="#F3F0EA"/>
  <rect x="28" y="28" width="1144" height="334" fill="#FBF9F4" stroke="#D9D4CB"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="62" y="74" fill="#74716D" font-size="12" font-weight="700" letter-spacing="2.8">HESHAM MOHAMED / PORTFOLIO</text>
    <text x="1138" y="74" fill="#74716D" font-size="12" text-anchor="end" letter-spacing="2.2">CAIRO · 2026</text>

    <text x="58" y="199" fill="#161616" font-size="88" font-weight="800" letter-spacing="-4.2">HESHAM</text>
    <text x="58" y="286" fill="#161616" font-size="88" font-weight="800" letter-spacing="-4.2">MOHAMED</text>

    <text x="62" y="330" fill="#66615C" font-size="15" letter-spacing="1.1">AI ENGINEER · COMPUTER VISION · APPLIED ML</text>
  </g>

  <g transform="translate(814 118)">
    <text x="0" y="0" fill="#77716B" font-family="Georgia, Times New Roman, serif" font-size="16" font-style="italic">I like building things that</text>
    <text x="0" y="42" fill="#161616" font-family="Georgia, Times New Roman, serif" font-size="34" font-style="italic">work outside</text>
    <text x="0" y="82" fill="#161616" font-family="Georgia, Times New Roman, serif" font-size="34" font-style="italic">the notebook.</text>

    <path d="M0 116H275" stroke="#C8C1B8"/>
    <circle cx="0" cy="116" r="4" fill="#D92D20">
      <animate attributeName="cx" values="0;275;0" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </circle>

    <g transform="translate(0 150)" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.7">
      <text x="0" y="0" fill="#77716B">BUILD</text>
      <text x="82" y="0" fill="#A9A39C">/</text>
      <text x="104" y="0" fill="#77716B">TEST</text>
      <text x="184" y="0" fill="#A9A39C">/</text>
      <text x="206" y="0" fill="#2B2927">SHIP</text>
    </g>
  </g>

  <rect x="1120" y="306" width="18" height="18" rx="9" fill="#D92D20" opacity="0.12">
    <animate attributeName="opacity" values="0.08;0.24;0.08" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="1129" cy="315" r="3" fill="#D92D20"/>
</svg>